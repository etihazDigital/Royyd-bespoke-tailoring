<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROYYD AI Fit</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="ai-fit-page">

    <div class="ai-fit-content">

        <div class="ai-human-scan">

            <div class="scan-ring"></div>

            <div class="scan-ring second-ring"></div>

            <div class="horizontal-scan"></div>

            <div class="vertical-scan"></div>

            <img src="https://i.postimg.cc/br1NCCqR/IMG-20260513-153329-removebg-preview-(2).png">

        </div>
        <h2 id="aiLoadingText">
            ROYYD AI is scanning your body profile
        </h2>


        <div class="ai-fit-progress">

            <div class="ai-fit-fill"></div>

        </div>

        <span id="aiFitPercent">

            0%

        </span>

    </div>

    <!-- SUCCESS -->

    <div class="fit-success" id="fitSuccess">

        <div class="success-circle">

            ✓

        </div>

        <h2>
            AI Analysis Complete
        </h2>

        <p>
            ROYYD AI has successfully generated your bespoke measurement profile.
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
