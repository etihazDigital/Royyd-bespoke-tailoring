<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
ROYYD Login
</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="login-page">

<div class="login-box">

<h1>
Welcome Back
</h1>

<p class="login-subtext">

Sign into your ROYYD account

</p>

<div class="login-form">

<input type="email"
id="loginEmail"
placeholder="Email Address">

<input type="password"
id="loginPassword"
placeholder="Password">

<button class="login-btn"
id="loginBtn">

Login

</button>

</div>

<div class="login-links">

<a href="#">

Forgot Password?

</a>

<a href="signup.html">

Create Account

</a>

</div>

</div>

</section>

<script type="module">

import { app }

from "./firebase.js";

import {

getAuth,

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const auth =
getAuth(app);

const loginBtn =
document.getElementById("loginBtn");

loginBtn.addEventListener("click", () => {

const email =
document.getElementById("loginEmail")
.value;

const password =
document.getElementById("loginPassword")
.value;

if(

email === "" ||

password === ""

){

alert("Please Fill All Details");

return;

}

signInWithEmailAndPassword(

auth,

email,

password

)

.then((userCredential) => {

const user =
userCredential.user;

localStorage.setItem(

"royydCurrentUser",

JSON.stringify({

email,

uid:user.uid

})

);

alert("Login Successful");

window.location.href =
"account.html";

})

.catch((error) => {

alert(error.message);

});

});

</script>

</body>

</html>
